[package]
name = "upkeep"
version = "0.1.0"
description = "One window for the applications installed on this machine and the residue their updaters leave behind"
authors = ["JESVN"]
edition = "2021"

[lib]
# The bin is a thin shell over the lib so integration tests in `tests/` can
# import the same module tree the application runs (src-tauri/README.md).
name = "upkeep_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
